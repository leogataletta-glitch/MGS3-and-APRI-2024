<!doctype html><html><meta charset="utf-8"><style>
body{margin:0;color:#104b3b;font:13px Georgia,serif;background:white}header{display:flex;gap:6px;align-items:center;padding:6px}small{flex:1;color:#65766e}button{background:#f2f6f3;border:1px solid #cbdcd2;border-radius:7px;color:#104b3b;padding:7px 12px;cursor:pointer}button:focus-visible,g:focus-visible{outline:2px solid #28745c}svg{width:100%;height:590px;touch-action:none;cursor:grab;user-select:none}.node{cursor:grab}.node:active,svg:active{cursor:grabbing}.node text{pointer-events:none}
</style><header><small></small><button id="zin" aria-label="Zoom +">+</button><button id="zout" aria-label="Zoom −">−</button><button id="reset"></button></header><svg id="graph" role="img" aria-label="Interactive causal diagram"><defs><marker id="pos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9Z" fill="#28745c"/></marker><marker id="neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9Z" fill="#a34242"/></marker></defs><g id="edges"></g><g id="nodes"></g><g id="cycle"></g></svg>
<script>
const {data,labels}=__PAYLOAD__, svg=document.querySelector('svg'), NS='http://www.w3.org/2000/svg';
document.querySelector('#reset').textContent=labels.reset;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
const headings=el('g',{},svg);
for(const [kind,ids] of Object.entries(data.groups||{})){if(!ids.length)continue;const ns=data.nodes.filter(n=>ids.includes(n.id)),x=ns.reduce((s,n)=>s+n.x,0)/ns.length,y=Math.min(...ns.map(n=>n.y))-65;el('text',{x,y,'text-anchor':'middle','font-size':13,fill:'#65766e'},headings).textContent=labels[kind];}
const nodes=new Map(),cycle=data.loop?.noeuds||[], pairs=new Set(cycle.map((n,i)=>n+'|'+cycle[(i+1)%cycle.length]));
for(const n of data.nodes){n.initial=[n.x,n.y];let lines=[''];for(const w of n.label.split(/\s+/)){let i=lines.length-1;if((lines[i]+' '+w).trim().length>20&&lines[i])lines.push(w);else lines[i]=(lines[i]+' '+w).trim();}n.h=16+14*lines.length;n.w=152;
 n.g=el('g',{class:'node',tabindex:0,role:'button','aria-label':n.label,'data-node':n.id,opacity:!cycle.length||cycle.includes(n.id)?1:.3},document.querySelector('#nodes'));
 el('title',{},n.g).textContent=n.label;
 el('rect',{x:-76,y:-n.h/2,width:152,height:n.h,rx:9,fill:n.central?'#104b3b':n.rank===1?'#eef3f0':'#f4f6f9',stroke:'#dbe3ec'},n.g);
 lines.forEach((line,i)=>{el('text',{x:0,y:-n.h/2+16+i*14,'text-anchor':'middle',fill:n.central?'white':'#104b3b','font-size':11,'font-weight':n.central?700:400},n.g).textContent=line;});
 nodes.set(n.id,n);n.g.addEventListener('keydown',e=>{const d={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(d){e.preventDefault();n.x+=d[0];n.y+=d[1];draw();}});
}
const links=data.edges.filter(e=>nodes.has(e.de)&&nodes.has(e.vers)).map(e=>{let color=e.signe>0?'#28745c':'#a34242',active=pairs.has(e.de+'|'+e.vers),g=el('g',{opacity:!cycle.length||active?1:.16},document.querySelector('#edges'));return {...e,path:el('path',{fill:'none',stroke:color,'stroke-width':active?2.6:1.3,'marker-end':e.signe>0?'url(#pos)':'url(#neg)'},g),sign:el('text',{'text-anchor':'middle','font-size':13,fill:color},g)};});
let badge;if(cycle.length){badge=el('g',{},document.querySelector('#cycle'));el('circle',{r:15,fill:'white',stroke:'#28745c'},badge);el('text',{y:5,'text-anchor':'middle','font-weight':700},badge).textContent=data.loop.type==='renforcante'?'R':'B';}
function border(n,cx,cy){const dx=cx-n.x,dy=cy-n.y,t=1/Math.max(Math.abs(dx)/(n.w/2+2),Math.abs(dy)/(n.h/2+2),.0001);return [n.x+dx*t,n.y+dy*t];}
function draw(){for(const n of nodes.values())n.g.setAttribute('transform',`translate(${n.x},${n.y})`);for(const e of links){const a=nodes.get(e.de),b=nodes.get(e.vers),dx=b.x-a.x,dy=b.y-a.y,cx=(a.x+b.x)/2-dy*.09,cy=(a.y+b.y)/2+dx*.09,[x1,y1]=border(a,cx,cy),[x2,y2]=border(b,cx,cy);e.path.setAttribute('d',`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`);e.sign.setAttribute('x',.25*x1+.5*cx+.25*x2);e.sign.setAttribute('y',.25*y1+.5*cy+.25*y2-5);e.sign.textContent=e.signe>0?'+':'−';}if(badge){const ns=cycle.map(n=>nodes.get(n)).filter(Boolean);badge.setAttribute('transform',`translate(${ns.reduce((s,n)=>s+n.x,0)/ns.length},${ns.reduce((s,n)=>s+n.y,0)/ns.length})`);}}
let view;function apply(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);}function reset(){for(const n of nodes.values())[n.x,n.y]=n.initial;const ns=[...nodes.values()],x=Math.min(...ns.map(n=>n.x-95)),y=Math.min(...ns.map(n=>n.y-n.h/2-65));view={x,y,w:Math.max(...ns.map(n=>n.x+95))-x,h:Math.max(...ns.map(n=>n.y+n.h/2+25))-y};apply();draw();}
function point(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());}
function zoom(f,p={x:view.x+view.w/2,y:view.y+view.h/2}){if(view.w*f<150||view.w*f>10000)return;view.x=p.x+(view.x-p.x)*f;view.y=p.y+(view.y-p.y)*f;view.w*=f;view.h*=f;apply();}
let drag=null;svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;const n=nodes.get(e.target.closest('.node')?.dataset.node);drag={id:e.pointerId,n,p:point(e)};svg.setPointerCapture(e.pointerId);e.preventDefault();});svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e),dx=p.x-drag.p.x,dy=p.y-drag.p.y;if(drag.n){drag.n.x+=dx;drag.n.y+=dy;drag.p=p;draw();}else{view.x-=dx;view.y-=dy;apply();}});for(const type of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(type,()=>{drag=null;});
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(Math.max(-100,Math.min(100,e.deltaY))*.002),point(e));},{passive:false});document.querySelector('#zin').onclick=()=>zoom(.8);document.querySelector('#zout').onclick=()=>zoom(1.25);document.querySelector('#reset').onclick=reset;reset();
</script></html>
