<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 Georgia,serif;color:#174d3b;background:#fff}main{max-width:1100px;margin:auto;padding:12px 20px}nav span{border-radius:24px;padding:7px 16px;border:1px solid #d7e2dc}nav{display:flex;justify-content:center;gap:12px;margin-bottom:24px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #d7e2dc;border-radius:24px;padding:7px 16px;background:#fff}nav span[aria-current=step]{background:#174d3b;color:white;border-color:#174d3b}button:focus-visible{outline:3px solid #739b85;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.stage{min-height:320px;text-align:center}h2{font-size:28px;font-weight:500;line-height:1.25;margin:8px 0 14px}.intro{max-width:770px;margin:0 auto 26px;color:#56665e;font-size:16px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center}.item{padding:4px 10px}.item b{display:block;font-size:19px;font-weight:600}.item p{font-size:14px;color:#56665e;margin:8px 0}.items.dimensions{grid-template-columns:repeat(2,1fr);gap:9px 26px;text-align:left;max-width:860px;margin:auto}.dimensions .item{font-size:14px;padding:3px 10px;border-left:2px solid #a9c4b4}.items.sources{grid-template-columns:repeat(4,1fr);gap:16px;padding-top:20px}.sources .item{border-top:2px solid #a9c4b4;padding-top:14px}.sources b{font-size:17px}.summary{text-align:center;color:#56665e;font-size:13px;margin:18px auto 14px;max-width:800px}footer{display:flex;justify-content:center;align-items:center;gap:12px}footer button{font-size:13px}.stage.animate{animation:enter .5s ease-out}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.stage.animate{animation:none}}@media(max-width:650px){main{padding:10px}.stage{min-height:0}h2{font-size:23px}.intro{font-size:14px}.items,.items.sources,.items.dimensions{grid-template-columns:1fr;gap:10px}.item b{font-size:17px}.item p{margin:3px 0}nav{gap:5px;margin-bottom:18px}nav span{padding:6px 8px;font-size:12px}.items.sources{padding-top:0}.sources .item{padding-top:8px}.summary{margin-top:20px}footer{padding-bottom:16px}}
.keyword{font:inherit;color:inherit;border:0;border-bottom:1px dotted #739b85;border-radius:0;padding:0 0 3px;background:transparent}.detail{display:none;font-size:14px;color:#56665e;max-width:650px;margin:14px auto}.item:hover .detail,.item:focus-within .detail{display:block}</style><main><nav aria-label="Étapes"></nav><section class="stage" aria-live="polite" aria-atomic="true"></section><p class="summary"></p><footer><button id="play"></button></footer></main><script>
const c=__CONTENT__, nav=document.querySelector('nav'),stage=document.querySelector('.stage');let step=0,timer=null,paused=false,hovered=false,focused=false;
function element(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.appendChild(e);return e;}
const tabs=c.hide_steps?[]:c.steps.map(s=>element('span',s,nav));if(c.hide_steps)nav.remove();
const play=document.querySelector('#play');const summary=document.querySelector('.summary');if(c.summary)summary.textContent=c.summary;else summary.remove();
function show(i){step=i;tabs.forEach((b,j)=>{if(i===j)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});stage.replaceChildren();stage.classList.remove('animate');element('h2',c.titles[i],stage);element('p',c.intro[i],stage).className='intro';const items=element('div','',stage);items.className='items'+(c.slides?' sources':i===1?' dimensions':i===2?' sources':'');const values=c.slides?c.slides[i]:i===0?c.attributes:i===1?c.dimensions:c.sources;if(c.slides)items.style.gridTemplateColumns='1fr';values.forEach(v=>{const item=element('div','',items);item.className='item';if(Array.isArray(v)){const key=element('button',v[0],item);key.className='keyword';const detail=element('p',v[1],item);detail.className='detail';detail.id='detail-'+i+'-'+items.children.length;key.setAttribute('aria-describedby',detail.id);}else element(c.slides||i===2?'b':'span',v,item);});requestAnimationFrame(()=>stage.classList.add('animate'));}
function schedule(){clearTimeout(timer);timer=null;play.textContent=paused?c.resume:c.pause;play.setAttribute('aria-pressed',String(paused));if(!paused&&!hovered&&!focused&&!document.hidden)timer=setTimeout(()=>{show((step+1)%c.steps.length);schedule();},7000);}
const main=document.querySelector('main');
main.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hovered=true;schedule();}});
main.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hovered=false;schedule();}});
main.addEventListener('focusin',e=>{focused=e.target!==play;schedule();});
main.addEventListener('focusout',()=>{setTimeout(()=>{focused=main.contains(document.activeElement)&&document.activeElement!==play;schedule();},0);});
document.addEventListener('visibilitychange',schedule);
play.onclick=()=>{paused=!paused;schedule();};show(0);schedule();
</script></html>
