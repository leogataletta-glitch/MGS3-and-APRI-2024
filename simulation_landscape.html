<!doctype html>
<html lang="__LANG__"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#233d30;font:15px/1.55 system-ui,sans-serif}h2{font:700 25px/1.2 Georgia;margin:0 0 5px}p{margin:7px 0}header{display:flex;justify-content:space-between;gap:16px;align-items:center}.badge{border:1px solid #789171;padding:7px 12px;white-space:nowrap;font:700 14px monospace;background:#eff3e4}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:16px 0 10px}.stat{background:#eef2e6;border-bottom:3px solid #9cad83;padding:7px 10px;font-size:12px}.stat strong{display:block;font:700 20px monospace;color:#233d30}.layout{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(260px,1fr);gap:15px}.screen{background:#35482e;padding:8px;border-radius:9px;box-shadow:0 4px 0 #b9c4aa}canvas{width:100%;aspect-ratio:800/480;image-rendering:pixelated;display:block;outline:none;touch-action:none}canvas:focus-visible{outline:3px solid #fff;outline-offset:2px}.controls{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.arrows{display:flex;gap:5px}button{font:600 13px/1.3 system-ui;color:#25462e;border:1px solid #9aaf8c;border-radius:5px;padding:10px 12px;background:#f4f6ec;cursor:pointer;touch-action:manipulation}button:hover{background:#e3edcf}button:focus-visible{outline:3px solid #b88a39;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}.arrows button{min-width:42px;touch-action:none}.panel{background:#f6f7ef;border:1px solid #dce4d1;padding:16px;border-radius:7px}.panel h3{font:700 17px monospace;margin:0 0 8px}.actions{display:grid;gap:8px;margin-top:12px}.actions button{text-align:left;white-space:normal}.actions small{display:block;font-weight:400;font-size:12px;margin-top:4px}.event{padding:10px 13px;background:#f6edcf;border-left:4px solid #b49347;margin:12px 0}.journal{max-height:140px;overflow:auto;font-size:13px;padding-left:21px}#outcome{background:#e9efda;padding:16px;margin:14px 0;border:1px solid #98ad83}#outcome:empty{display:none}details{margin-top:12px;font-size:13px}summary{cursor:pointer;font-weight:600}.muted{font-size:12px;color:#61705f}@media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}header{flex-wrap:wrap}.panel{padding:12px}}

body{padding:18px;background:#f7f8f2;color:#234a40;font-size:14px}header{padding:3px 0 12px}h2{font:700 32px/1.15 Georgia;color:#254e43;letter-spacing:-.8px}header p{color:#76867a}.badge{border:0;border-radius:30px;background:#244d41;color:#f3edd7;padding:12px 18px;font:600 13px system-ui}.stats{gap:10px}.stat{border:1px solid #e0e6da;background:#fff;border-radius:12px;padding:10px 14px;color:#798879}.stat strong{font:700 23px/1.5 system-ui;color:#2b574a}.screen{padding:0;background:#769f70;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #294c3920;border:4px solid #fff}canvas{image-rendering:auto}.layout{grid-template-columns:minmax(0,2.8fr) minmax(235px,1fr);align-items:start}.panel{border:1px solid #e1e7db;background:#fff;border-radius:16px;box-shadow:0 8px 20px #3f634008;padding:20px;min-height:310px}.panel h3{font:700 18px Georgia;color:#285b47}.panel p{color:#6a7b6d;line-height:1.7}.actions button{background:#edf3e7;border:1px solid #d8e4ce;border-radius:10px;padding:14px;color:#315b47;transition:background .15s,transform .15s}.actions button:hover:enabled{transform:translateY(-1px);background:#e1ecd7}.actions small{color:#71836e}.event{border:1px solid #ece2c9;border-left:3px solid #cfa966;border-radius:10px;background:#fff7e6;color:#82714b;padding:11px 16px}.controls button{border-radius:10px;background:#fff;min-height:41px;border:1px solid #dce3d6}#sleep{background:#315e4d;color:#fff;border:0;padding:12px 18px}.arrows button{min-width:42px}details{background:#fff;padding:13px 16px;border:1px solid #e4e9de;border-radius:12px}.journal{color:#71806f}.muted{line-height:1.7}#outcome{border-radius:14px}@media(max-width:900px){body{padding:10px}.layout{grid-template-columns:1fr}.panel{min-height:0}h2{font-size:26px}}
</style>
<header><div><h2 id="title"></h2><p id="subtitle"></p></div><span class="badge" id="day"></span></header>
<section id="family" class="controls" aria-label="Household"></section><p id="familyInfo" class="muted"></p><div class="stats" id="stats"></div><div class="event" id="weather" role="status"></div>
<div class="layout"><div><div class="screen"><canvas id="world" width="1600" height="960" tabindex="0"></canvas></div>
<div class="controls"><div class="arrows"><button data-key="ArrowLeft" aria-label="Left">←</button><button data-key="ArrowUp" aria-label="Up">↑</button><button data-key="ArrowDown" aria-label="Down">↓</button><button data-key="ArrowRight" aria-label="Right">→</button></div><button id="sleep"></button><button id="reset"></button></div><p class="muted" id="help"></p></div>
<section class="panel"><h3 id="place"></h3><p id="description"></p><div id="actions" class="actions"></div><p id="notice" role="status" aria-live="polite"></p></section></div>
<div id="outcome" role="status"></div><details open><summary id="journalTitle"></summary><ul class="journal" id="journal"></ul></details><details><summary id="rulesTitle"></summary><p id="rules"></p></details><p class="muted" id="fiction"></p>
<script>
'use strict';
const fr=document.documentElement.lang!=='en',T=(a,b)=>fr?a:b,$=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const places=[
 {id:'school',x:380,y:195,label:T('ÉCOLE','SCHOOL'),desc:T('Rose, votre fille de 8 ans, peut aller à l’école. Un parent l’accompagne : 2 pièces et 1 action. L’école ferme pendant les ouragans.','Rose, your eight-year-old daughter, can attend school. One parent accompanies her: 2 coins and 1 action. School closes during hurricanes.')},
 {id:'church',x:560,y:170,label:T('ÉGLISE','CHURCH'),desc:T('L’église accueille une cuisine solidaire ouverte à tous. Une aide alimentaire est disponible une fois tous les trois jours. Vous pouvez aussi y organiser l’entraide.','The church hosts a community kitchen open to everyone. Food support is available once every three days. You can also organise mutual aid here.')},
 {id:'home',x:120,y:300,label:T('MAISON','HOME'),desc:T('Ici, la famille se repose. Terminer la journée consomme 3 provisions et 1 unité de combustible.','Your family rests here. Ending a day consumes 3 food and 1 unit of fuel.')},
 {id:'farm',x:280,y:150,label:T('FERME','FARM'),desc:T('Semer exige argent et énergie. Les cultures mettent trois nuits à pousser ; un ouragan peut détruire la récolte.','Sowing takes money and energy. Crops need three nights to grow; a hurricane can destroy the harvest.')},
 {id:'forest',x:115,y:145,label:T('FORÊT','FOREST'),desc:T('Le bois rapporte vite et sert à cuisiner. Mais couper dégrade la forêt ; les jeunes arbres ont besoin d’une clôture et de temps.','Wood brings quick income and cooking fuel. Cutting depletes the forest; young trees need a fence and time.')},
 {id:'market',x:480,y:300,label:T('MARCHÉ','MARKET'),desc:T('Acheter, vendre, travailler : les prix et les routes déterminent ce qui est possible.','Buy, sell, work: prices and roads determine what is possible.')},
 {id:'clinic',x:465,y:100,label:T('DISPENSAIRE','CLINIC'),desc:T('Les soins coûtent 6 pièces et une action. Les symptômes réduisent l’énergie disponible chaque matin.','Care costs 6 coins and one action. Illness reduces the energy available each morning.')},
 {id:'sea',x:675,y:345,label:T('MER','SEA'),desc:T('La pêche nourrit la famille mais épuise le stock. La sortie en mer est impossible pendant l’ouragan.','Fishing feeds the family but depletes stocks. Going to sea is impossible during a hurricane.')},
 {id:'village',x:330,y:370,label:T('PLACE DU VILLAGE','VILLAGE SQUARE'),desc:T('S’organiser prend du temps. Deux participations ouvrent une aide collective et réduisent les dégâts du prochain ouragan.','Organising takes time. Two contributions unlock collective aid and reduce damage from the next hurricane.')}
];
let s,keys={},last=0,clock=0,selected='home';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){s={day:1,money:12,food:8,wood:3,health:100,energy:3,forest:75,fish:75,soil:70,x:120,y:320,crops:[],trees:[],fence:false,stove:false,roof:false,sick:false,group:0,aid:false,losses:0,hungry:0,done:false,log:[]};s.active=0;s.members=[{name:'Jean',energy:3,x:120,y:320,task:T('À répartir','Unassigned')},{name:'Marie',energy:3,x:151,y:320,task:T('À répartir','Unassigned')}];s.schoolDays=0;s.schoolDay=0;s.mealDay=-3;
 Object.defineProperty(s,'energy',{get(){return this.members[this.active].energy},set(v){this.members[this.active].energy=v},configurable:true});keys={};selected='home';$('outcome').textContent='';log(T('Vous avez 20 jours devant vous. Aller à un lieu ne coûte pas d’action.','You have 20 days ahead. Walking to a place costs no action.'));renderUI();}
function switchPerson(index){if(s.done||index===s.active)return;s.members[s.active].x=s.x;s.members[s.active].y=s.y;s.active=index;s.x=s.members[index].x;s.y=s.members[index].y;keys={};renderUI();}
function familyUI(){$('family').replaceChildren();s.members.forEach((m,i)=>{let b=document.createElement('button');b.textContent=m.name+' · '+m.energy+'/3 '+T('actions','actions')+' · '+m.task;b.setAttribute('aria-pressed',String(i===s.active));b.style.background=i===s.active?'#315e4d':'white';b.style.color=i===s.active?'white':'#315e4d';b.disabled=s.done;b.onclick=()=>switchPerson(i);$('family').append(b);});$('familyInfo').textContent=T('Jean et Marie sont mariés. Vous dirigez les deux adultes, chacun avec ses actions et sa position. Argent, nourriture et bois sont partagés. Rose : ','Jean and Marie are married. You control both adults, each with their own actions and location. Money, food and wood are shared. Rose: ')+s.schoolDays+T(' jours d’école. Le foyer consomme 3 provisions par nuit.',' school days. The household consumes 3 food each night.');}
function log(text){s.log.unshift(T('Jour ','Day ')+s.day+' · '+text);$('notice').textContent=text;}
function storm(day=s.day){return day===7||day===15;}
function nearest(){return places.find(p=>Math.hypot(p.x-s.x,p.y-s.y)<67);}
function price(){return [8,9,16,17].includes(s.day)?3:2;}
function actions(id){const a=[];function add(key,label,cost,blocked=''){a.push({key,label,cost,blocked});}
 const cash=n=>s.money<n?T('Pas assez d’argent','Not enough money'):'';
 if(id==='home'){add('roof',T('Renforcer le toit','Reinforce the roof'),T('8 pièces · 2 bois · protège la maison','8 coins · 2 wood · protects the home'),s.roof?T('Déjà renforcé','Already reinforced'):cash(8)||(s.wood<2?T('2 bois nécessaires','Needs 2 wood'):''));}
 if(id==='farm'){add('sow',T('Semer une culture','Sow one crop'),T('2 pièces → 7 provisions dans 3 nuits','2 coins → 7 food in 3 nights'),cash(2)||(s.crops.length>=3?T('Les 3 parcelles sont occupées','All 3 plots are occupied'):''));add('mixed',T('Planter des cultures diversifiées','Plant diversified crops'),T('5 pièces → 10 provisions · sol amélioré · pertes réduites','5 coins → 10 food · improves soil · fewer losses'),cash(5)||(s.crops.length>=3?T('Les 3 parcelles sont occupées','All 3 plots are occupied'):''));}
 if(id==='forest'){add('cut',T('Collecter du bois','Collect wood'),T('+4 bois · forêt −12 · sol −3','+4 wood · forest −12 · soil −3'),s.forest<15?T('Forêt trop dégradée','Forest too depleted'):'');add('fence',T('Clôturer les jeunes plantations','Fence the planting area'),T('5 pièces · 2 bois · protège du bétail','5 coins · 2 wood · protects from livestock'),s.fence?T('Déjà clôturé','Already fenced'):cash(5)||(s.wood<2?T('2 bois nécessaires','Needs 2 wood'):''));add('trees',T('Replanter des arbres','Replant trees'),T('4 pièces · forêt +15 après 4 nuits','4 coins · forest +15 after 4 nights'),!s.fence?T('Une clôture est nécessaire','A fence is needed'):cash(4));}
 if(id==='sea'){add('fish',T('Pêcher','Fish'),T('+4 provisions si stock ≥30, sinon +1 · stock −14','+4 food if stock ≥30, otherwise +1 · stock −14'),storm()?T('Mer fermée : ouragan','Sea closed: hurricane'):s.fish<10?T('Stock trop faible','Stock too low'):'');}
 if(id==='market'){const shut=storm()?T('Route fermée par l’ouragan','Road closed by hurricane'):'';add('buy',T('Acheter 3 provisions','Buy 3 food'),(price()*3)+T(' pièces',' coins'),shut||cash(price()*3));add('sell',T('Vendre 2 bois','Sell 2 wood'),T('+5 pièces','+5 coins'),shut||(s.wood<2?T('2 bois nécessaires','Needs 2 wood'):''));add('work',T('Faire une journée de travail','Take a work shift'),T('+5 pièces · utilise 1 action','+5 coins · uses 1 action'),shut);add('stove',T('Acheter un foyer économe','Buy an efficient stove'),T('10 pièces · combustible une nuit sur deux','10 coins · fuel every other night'),s.stove?T('Déjà équipé','Already equipped'):shut||cash(10));}
 if(id==='clinic')add('care',T('Recevoir des soins','Receive care'),T('6 pièces · +35 santé · fin de la maladie','6 coins · +35 health · ends illness'),!s.sick&&s.health>=100?T('Aucun soin nécessaire','No care needed'):cash(6));
 if(id==='school')add('school',T('Accompagner Rose à l’école','Take Rose to school'),T('2 pièces · +1 jour de scolarité','2 coins · +1 school day'),storm()?T('École fermée : ouragan','School closed: hurricane'):s.schoolDay===s.day?T('Rose est déjà à l’école','Rose is already at school'):cash(2));
 if(id==='church')add('meal',T('Aider à la cuisine solidaire','Help at the community kitchen'),T('+3 provisions · une fois tous les 3 jours','+3 food · once every 3 days'),s.day-s.mealDay<3?T('Prochaine aide jour ','Next support on day ')+(s.mealDay+3):'');
 if(id==='village'||id==='church')add('group',T('Participer à l’entraide','Join mutual aid'),T('2 actions sur 2 jours → aide de 8 pièces + préparation','2 actions on 2 days → 8 coins aid + preparedness'),s.group>=2?T('Réseau organisé','Network organised'):s.groupDay===s.day?T('Revenez demain','Return tomorrow'):'');
 return a;}
function act(key){if(s.done)return;const p=nearest();if(!p)return;const a=actions(p.id).find(a=>a.key===key);if(!a||a.blocked||s.energy<1)return;s.energy--;s.members[s.active].task=a.label;let msg=s.members[s.active].name+' · '+a.label;
 switch(key){case 'school':s.money-=2;s.schoolDay=s.day;s.schoolDays++;break;case 'meal':s.food+=3;s.mealDay=s.day;break;case 'roof':s.money-=8;s.wood-=2;s.roof=true;break;case 'sow':case 'mixed':s.money-=key==='mixed'?5:2;s.crops.push({due:s.day+3,mixed:key==='mixed'});s.soil=clamp(s.soil+(key==='mixed'?4:-4),0,100);break;case 'cut':s.wood+=4;s.forest-=12;s.soil=clamp(s.soil-3,0,100);break;case 'fence':s.money-=5;s.wood-=2;s.fence=true;break;case 'trees':s.money-=4;s.trees.push(s.day+4);break;case 'fish':s.food+=s.fish>=30?4:1;s.fish=clamp(s.fish-14,0,100);break;case 'buy':s.money-=price()*3;s.food+=3;break;case 'sell':s.wood-=2;s.money+=5;break;case 'work':s.money+=5;break;case 'stove':s.money-=10;s.stove=true;break;case 'care':s.money-=6;s.health=Math.min(100,s.health+35);s.sick=false;break;case 'group':s.group++;s.groupDay=s.day;if(s.group===2){s.money+=8;s.aid=true;msg=T('Entraide organisée : 8 pièces et préparation collective.','Mutual aid organised: 8 coins and collective preparedness.');}break;}
 log(msg);renderUI();}
function sleep(){if(s.done)return;const missing=Math.max(0,3-s.food);s.food=Math.max(0,s.food-3);if(missing){s.health-=missing*12;s.hungry++;log(T('Provisions insuffisantes : la santé baisse.','Not enough food: health falls.'));}
 if(!s.stove||s.day%2===0){if(s.wood>0)s.wood--;else{s.health-=5;log(T('Pas de combustible pour cuisiner.','No cooking fuel.'));}}
 if(s.sick)s.health-=7;else if(!missing)s.health=Math.min(100,s.health+3);
 if(s.health<=0){s.health=0;finish(T('La famille a besoin d’une aide d’urgence.','The family needs emergency support.'));return;}
 if(s.day===20){finish(T('Les vingt jours sont terminés.','The twenty days are over.'));return;}
 s.day++;if(storm()){const protectedHome=s.roof||s.aid;let loss=Math.min(s.food,protectedHome?1:4);s.food-=loss;s.losses+=loss;log(T('Ouragan : routes et mer fermées. Provisions perdues : ','Hurricane: roads and sea closed. Food lost: ')+loss+'.');for(const crop of s.crops)crop.damaged=true;}
 if(s.day===10){s.sick=true;log(T('Une maladie frappe le foyer : énergie réduite à 2 et santé −7 par nuit jusqu’aux soins pour le foyer.','Illness hits the household: energy reduced to 2 and health −7 each night until household care.'));}
 s.crops=s.crops.filter(crop=>{if(crop.due>s.day)return true;let yieldFood=crop.mixed?10:7;if(crop.damaged)yieldFood=Math.floor(yieldFood*(crop.mixed?.7:.3));if(s.soil<35)yieldFood=Math.floor(yieldFood*.5);s.food+=yieldFood;log(T('Récolte : +','Harvest: +')+yieldFood+T(' provisions.',' food.'));return false;});
 s.trees=s.trees.filter(due=>{if(due>s.day)return true;s.forest=clamp(s.forest+15,0,100);s.soil=clamp(s.soil+5,0,100);log(T('Les arbres poussent : forêt +15, sol +5.','Trees grow: forest +15, soil +5.'));return false;});
 s.forest=clamp(s.forest+1,0,100);s.fish=clamp(s.fish+4,0,100);s.members.forEach(m=>{m.energy=s.sick?2:3;m.task=T('À répartir','Unassigned');});log(T('Une nouvelle journée commence.','A new day begins.'));renderUI();}
function finish(reason){s.done=true;keys={};log(reason);$('outcome').textContent=reason+' '+T('Jours sans provisions suffisantes : ','Days with insufficient food: ')+s.hungry+'. '+T('Scolarité : ','School attendance: ')+s.schoolDays+T(' jours. ',' days. ')+T('Forêt : ','Forest: ')+Math.round(s.forest)+'/100 · '+T('Stock de poissons : ','Fish stock: ')+Math.round(s.fish)+'/100. '+T('Quelles dépenses avez-vous dû différer ? Rejouez pour comparer travail, pêche, plantations et entraide.','Which expenses did you postpone? Play again to compare work, fishing, planting and mutual aid.');renderUI();}
function renderUI(){familyUI();const p=nearest();selected=p?p.id:'path';$('day').textContent=T('JOUR ','DAY ')+s.day+' / 20';$('stats').innerHTML=[[T('Pièces','Coins'),s.money],[T('Provisions','Food'),s.food],[T('Bois','Wood'),s.wood],[T('Santé','Health'),s.health+'/100'],[T('Actions de ','Actions: ')+s.members[s.active].name,s.energy],[T('Sol','Soil'),s.soil+'/100']].map(([k,v])=>'<div class="stat">'+k+'<strong>'+v+'</strong></div>').join('');
 $('weather').textContent=(storm()?T('OURAGAN — mer et marché fermés.','HURRICANE — sea and market closed.'):[6,14].includes(s.day)?T('ALERTE — ouragan annoncé demain. Préparez des provisions.','WARNING — hurricane forecast tomorrow. Prepare food supplies.'):T('Temps calme.','Calm weather.'))+' '+(s.sick?T('Maladie au foyer. ','Illness at home. '):'')+T('Forêt ','Forest ')+s.forest+'/100 · '+T('Poissons ','Fish ')+s.fish+'/100'+(price()===3?T(' · Prix alimentaires en hausse.',' · Food prices have risen.'):'');
 $('place').textContent=p?p.label:T('EN CHEMIN','ON THE PATH');$('description').textContent=p?p.desc:T('Approchez-vous d’un bâtiment, de la forêt ou du quai pour agir.','Walk close to a building, the forest or the jetty to act.');$('actions').replaceChildren();
 if(p&&!s.done)for(const a of actions(p.id)){const b=document.createElement('button');b.textContent=a.label;const sub=document.createElement('small');sub.textContent=a.cost+' · '+T('1 action','1 action')+(a.blocked?' — '+a.blocked:s.energy<1?' — '+T('Reposez-vous pour récupérer','Rest to recover'):'');b.append(sub);b.disabled=!!a.blocked||s.energy<1;b.onclick=()=>act(a.key);$('actions').append(b);}
 if(p?.id==='farm'){$('description').textContent+=' '+T('Parcelles occupées : ','Occupied plots: ')+s.crops.length+'/3. '+s.crops.map(c=>T('Récolte jour ','Harvest day ')+c.due).join(' · ');}
 $('sleep').disabled=s.done;$('journal').replaceChildren();for(const message of s.log.slice(0,20)){const li=document.createElement('li');li.textContent=message;$('journal').append(li);}}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
// Original illustrated scenery. World coordinates stay independent of backing resolution.
const palette={grass:'#83b875',dark:'#285842',sand:'#ecd5a0',water:'#248a9c'};
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function path(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();}
function box(x,y,w,h,color,r=4){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function tree(x,y,size=1,seed=0){ctx.save();ctx.translate(x,y);ctx.scale(size,size);const sway=Math.sin(clock*1.3+seed)*1.4;
 ellipse(9,9,24,9,'#244b3930');path([[0,8],[1,-24]],'#725a40',8);path([[0,-10],[-9,-23]],'#725a40',4);
 ellipse(sway,-28,25,23,'#276448');ellipse(sway-13,-34,17,18,'#347e50');ellipse(sway+9,-41,20,18,'#469357');ellipse(sway-4,-49,16,12,'#69aa62');
 for(let i=0;i<8;i++)ellipse(sway+Math.sin(i*4+seed)*17,-32+Math.cos(i*7)*13,4,2,i%2?'#83b66a60':'#1d684740');ctx.restore();}
function palm(x,y){ellipse(x+12,y+6,28,8,'#284d3530');path([[x,y],[x+3,y-25],[x-2,y-52]],'#9d8054',6);for(let i=0;i<6;i++){let angle=i*Math.PI/3;let ax=x-2+Math.cos(angle)*35,ay=y-51+Math.sin(angle)*14;path([[x-2,y-52],[(x+ax)/2,y-65],[ax,ay]],i%2?'#368967':'#236d58',7);} }
